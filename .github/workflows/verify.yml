name: Verify Horsemen
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build prerequisites
        run: python -m pip install 'setuptools==77.0.3' wheel
      - name: Verify both interfaces
        run: python -B scripts/verify.py --output "$RUNNER_TEMP/horsemen-verification"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horsemen-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/horsemen-verification
