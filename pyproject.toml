[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "horsemen"
dynamic = ["version"]
description = "Keep project context useful: one agent skill and a local CLI"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]

[project.urls]
Repository = "https://github.com/hungv47/horsemen"
Issues = "https://github.com/hungv47/horsemen/issues"

[project.scripts]
horsemen = "horsemen_core.cli:main"

[tool.setuptools.dynamic]
version = {attr = "horsemen_core.__version__"}

[tool.setuptools.packages.find]
where = ["horsemen/scripts"]
include = ["horsemen_core*"]
