[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "horsemen-local-prototype"
version = "0.1.0a5"
description = "Local read-only Horsemen CLI prototype"
requires-python = ">=3.10"
dependencies = []
classifiers = ["Private :: Do Not Upload"]
readme = "CLI-PROTOTYPE.md"

[project.scripts]
horsemen = "horsemen_core.cli:main"

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["horsemen_core*"]
